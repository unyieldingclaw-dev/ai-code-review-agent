name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # WHY skip docs-only PRs: this job runs the full 15-agent swarm sequentially against a local
    # model, so it costs several minutes of the single self-hosted runner every time. Reviewing a
    # markdown-only change buys nothing -- most agents have nothing to say about prose, and the
    # ones that do are the weakest signal. Safe to skip entirely because `ai-review` is NOT a
    # required status check (branch protection requires only `test`), so a PR that never triggers
    # this workflow is still mergeable rather than stuck waiting on a check that will never report.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'memory-bank/**'
      - LICENSE

jobs:
  ai-review:
    # WHY: this job runs on a self-hosted runner (needs local Ollama) and its early steps
    # (checkout, `npm ci`) execute code from the PR branch before this workflow's own logic ever
    # runs -- npm install/postinstall scripts are enough for arbitrary code execution. Skipping
    # the whole job for fork-origin PRs (this repo takes no outside contributors) means untrusted
    # code never touches this machine. Same-repo branches (including Dependabot's) still pass,
    # since their head repo is this repo, not a fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted # Requires Ollama on the runner
    # WHY a job-level timeout, and why 45: without one this job inherits GitHub's 6-hour default.
    # On 2026-08-21 a run hung for 43 minutes having never started step 1 -- the listener accepted
    # the job and never spawned a Worker (no Worker log was written), so no step-level timeout
    # could have fired; only a job-level one covers job-init hangs. It held the single self-hosted
    # runner the whole time and queued every other PR behind it, and nothing failed or alerted --
    # it simply looked slow.
    #
    # 45 is chosen against the tool's own bound, not intuition: the swarm runs 15 agents
    # sequentially with agentTimeoutMs 180s scaling to 2x on large diffs, so a worst-case run is
    # ~90 minutes, while every observed run here has been 4-8.5 minutes. 45 sits far above real
    # runs and far below "wedged", accepting that a pathological max-size diff would be cut off --
    # a visible failure, which is the point. It is a backstop, not a fix: the underlying cause is
    # that the runner is not supervised (no service, no restart-on-failure).
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      pull-requests: write
      contents: read
    defaults:
      run:
        # WHY: every `run:` step here assumes bash (wc -c, POSIX ||, and the "Write Step
        # Summary" step's backslash-escaped `${...}` template-literal syntax, which is bash
        # escaping and not valid PowerShell). GitHub Actions defaults `run:` steps to pwsh on
        # Windows runners (this one is self-hosted Windows) unless a shell is declared, so
        # "Write Step Summary" was silently running its script through pwsh, producing a
        # malformed .ps1 and failing with ParserError/SyntaxError on every PR. Setting bash at
        # the job level fixes every step at once instead of patching one.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # WHY this step, before anything else needs `shell: bash` to work: on this self-hosted
      # Windows runner, `C:\Windows\system32\bash.exe` (the WSL launcher stub) is on PATH ahead
      # of Git for Windows' real bash (`C:\Program Files\Git\bin`, which isn't on PATH at all),
      # so a bare `bash` lookup resolved to the WSL stub. WSL's default distro is
      # `docker-desktop`, which has no usable `/bin/bash` for this relay, so every later step
      # failed with `WSL ERROR: execvpe(/bin/bash) failed: No such file or directory` --
      # regardless of the PR's content. Prepending Git's bin dir to $GITHUB_PATH here (via an
      # explicit `shell: pwsh`, since bash isn't resolvable yet) fixes resolution for every
      # subsequent step's plain `shell: bash` without hand-constructing a custom shell command
      # string (which GitHub Actions' Windows shell parser mishandles for quoted paths with
      # spaces -- confirmed empirically: it mangles the quote into the tool-cache path prefix).
      - name: Fix bash resolution (Git's bash, not the WSL stub)
        shell: pwsh
        run: echo "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check formatting
        run: npm ci && npm run format:check

      - name: Install ai-review-agent
        run: npm install -g ai-review-agent

      - name: Generate diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          echo "Diff size: $(wc -c < pr.diff) bytes"

      # WHY continue-on-error (not "|| true"): "|| true" always exits 0, so a crash/timeout here
      # was completely invisible -- the step showed a plain green checkmark identical to a real
      # clean run, and (per the steps below) no PR comment was even posted noting the skip.
      # continue-on-error still lets the rest of the job run, but marks this specific step with a
      # visible "failed" indicator in the GitHub UI, and steps.review.outcome below lets the
      # comment/summary steps report the failure explicitly instead of silently doing nothing.
      - name: Run AI Review
        id: review
        continue-on-error: true
        run: |
          ai-review-agent --diff pr.diff --format json --out findings.json
        env:
          OLLAMA_URL: http://localhost:11434

      - name: Post PR Comment
        if: always()
        uses: actions/github-script@v9
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        with:
          script: |
            const fs = require('fs')
            const lines = ['<!-- ai-review-agent:v1 -->', '## 🤖 AI Code Review', '']
            if (!fs.existsSync('findings.json')) {
              // WHY post a comment here instead of silently returning: this is the exact gap
              // audit finding C6 identified -- a crashed/timed-out review previously left no
              // trace anywhere a reviewer would look. steps.review.outcome distinguishes a real
              // crash from the (expected, non-error) case of the review genuinely producing no
              // output for another reason.
              lines.push(
                process.env.REVIEW_OUTCOME === 'failure'
                  ? '⚠️ AI review failed to run (see the "Run AI Review" step logs for details). No review was performed for this PR.'
                  : '⚠️ AI review did not produce output for this PR (no findings.json). See workflow logs.'
              )
              const body = lines.join('\n')
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
              })
              const existing = comments.data.find(c => c.body.includes('<!-- ai-review-agent:v1 -->'))
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: existing.id, body
                })
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number, body
                })
              }
              return
            }
            const result = JSON.parse(fs.readFileSync('findings.json', 'utf8'))
            const findings = result.findings ?? []
            // This block previously read `result.findings` and nothing else, so a fail-fast run,
            // a truncated diff, an abandoned chunk loop and a run whose agents all failed each
            // posted "✅ No issues found." on the PR -- the highest-visibility surface in the repo
            // asserting a clean review that never happened. The four-formatter rule in
            // systemPatterns.md could not catch it, because this is not a formatter: it is a
            // second renderer hand-written in YAML. Both this and the Step Summary below now go
            // through scripts/reviewIncompleteness.cjs so they cannot drift apart.
            const { incompletenessLines, noFindingsVerdict } = require('./scripts/reviewIncompleteness.cjs')
            const banner = incompletenessLines(result)
            if (banner.length > 0) {
              lines.push(...banner)
              lines.push('')
            }
            if (findings.length === 0) {
              lines.push(noFindingsVerdict(result))
            } else {
              for (const f of findings) {
                const emoji = { critical: '🔴', high: '🟠', medium: '🟡', low: '🔵' }[f.severity] ?? '⚪'
                lines.push(`### ${emoji} ${f.title}`)
                lines.push(`**${f.agent}** · \`${f.file}:${f.line}\` · ${f.basis}`)
                lines.push('')
                lines.push(f.detail)
                lines.push('')
                lines.push(`> 💡 ${f.suggestion}`)
                lines.push('')
                lines.push('---')
                lines.push('')
              }
            }
            const body = lines.join('\n')
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            })
            const existing = comments.data.find(c => c.body.includes('<!-- ai-review-agent:v1 -->'))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body
              })
            }

      - name: Write Step Summary
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          node -e "
            const fs = require('fs')
            if (!fs.existsSync('findings.json')) {
              const status = process.env.REVIEW_OUTCOME === 'failure'
                ? '⚠️ AI review failed to run — see the Run AI Review step logs.'
                : '⚠️ AI review produced no output (no findings.json).'
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, \`## AI Review\n\${status}\n\`)
              process.exit(0)
            }
            const r = JSON.parse(fs.readFileSync('findings.json','utf8'))
            // Same gate as the PR comment above, through the same module -- see the comment there.
            // An empty findings table is the Step Summary's version of a green check, and it was
            // making the same unqualified claim.
            const { incompletenessLines } = require('./scripts/reviewIncompleteness.cjs')
            const banner = incompletenessLines(r)
            const bannerText = banner.length ? banner.join('\n\n') + '\n\n' : ''
            const empty = banner.length ? '| — | — | — | No findings in the portion reviewed |' : '| — | — | — | No findings |'
            const rows = (r.findings||[]).map(f => \`| \${f.severity} | \${f.agent} | \${f.file}:\${f.line} | \${f.title} |\`).join('\n')
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, \`## AI Review\n\${bannerText}| Severity | Agent | Location | Issue |\n|---|---|---|---|\n\${rows||empty}\n\`)
          "

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-review-findings
          path: findings.json
          if-no-files-found: ignore
