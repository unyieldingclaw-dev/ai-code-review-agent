name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: self-hosted # Requires Ollama on the runner
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check formatting
        run: npm ci && npm run format:check

      - name: Install ai-review-agent
        run: npm install -g ai-review-agent

      - name: Generate diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          echo "Diff size: $(wc -c < pr.diff) bytes"

      - name: Run AI Review
        id: review
        run: |
          ai-review-agent --diff pr.diff --format json --out findings.json || true
        env:
          OLLAMA_URL: http://localhost:11434

      - name: Post PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('findings.json')) {
              console.log('No findings.json — skipping comment')
              return
            }
            const result = JSON.parse(fs.readFileSync('findings.json', 'utf8'))
            const findings = result.findings ?? []
            const lines = ['<!-- ai-review-agent:v1 -->', '## 🤖 AI Code Review', '']
            if (findings.length === 0) {
              lines.push('✅ No issues found.')
            } else {
              for (const f of findings) {
                const emoji = { critical: '🔴', high: '🟠', medium: '🟡', low: '🔵' }[f.severity] ?? '⚪'
                lines.push(`### ${emoji} ${f.title}`)
                lines.push(`**${f.agent}** · \`${f.file}:${f.line}\` · ${f.basis}`)
                lines.push('')
                lines.push(f.detail)
                lines.push('')
                lines.push(`> 💡 ${f.suggestion}`)
                lines.push('')
                lines.push('---')
                lines.push('')
              }
            }
            const body = lines.join('\n')
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            })
            const existing = comments.data.find(c => c.body.includes('<!-- ai-review-agent:v1 -->'))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body
              })
            }

      - name: Write Step Summary
        if: always()
        run: |
          node -e "
            const fs = require('fs')
            if (!fs.existsSync('findings.json')) process.exit(0)
            const r = JSON.parse(fs.readFileSync('findings.json','utf8'))
            const rows = (r.findings||[]).map(f => \`| \${f.severity} | \${f.agent} | \${f.file}:\${f.line} | \${f.title} |\`).join('\n')
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, \`## AI Review\n| Severity | Agent | Location | Issue |\n|---|---|---|---|\n\${rows||'| — | — | — | No findings |'}\n\`)
          "

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-findings
          path: findings.json
          if-no-files-found: ignore
