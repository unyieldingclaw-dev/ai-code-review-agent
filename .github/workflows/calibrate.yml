name: Calibration

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  release:
    types: [published]
  workflow_dispatch: # Manual trigger

jobs:
  calibrate:
    runs-on: self-hosted
    timeout-minutes: 20 # was 10 -- never validated against real runtime, since the job never
    # got past the shell-default bug below far enough to reach the actual calibration suite.
    # A manual workflow_dispatch run once that bug was fixed completed 12 of 16 cases in ~9min
    # before hitting the old 10min limit (~30-70s/case); 20min leaves real margin for the full
    # 16-case suite + testgen check.
    continue-on-error: true # non-blocking — release publishes even if runner is offline
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    defaults:
      run:
        # WHY: `run:` steps default to pwsh on this self-hosted Windows runner unless a shell
        # is declared, and the "Check Ollama availability" step below uses bash if/then/fi
        # syntax -- see review.yml's matching comment for the exact ParserError this caused
        # here, confirmed via this workflow's own run history: every calibrate run failed at
        # that step in ~16s, masked as workflow-level "success" only because of
        # continue-on-error above.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # WHY this step: see the matching comment in review.yml -- a bare `bash` on this runner
      # resolves to a broken WSL stub ahead of Git for Windows' real bash on PATH. Prepending
      # Git's bin dir here (via explicit `shell: pwsh`, since bash isn't resolvable yet) fixes
      # resolution for every subsequent `shell: bash` step.
      - name: Fix bash resolution (Git's bash, not the WSL stub)
        shell: pwsh
        run: echo "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check Ollama availability
        id: ollama
        run: |
          if curl -sf http://localhost:11434/api/tags > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ollama not available on this runner — skipping calibration"
          fi

      - name: Install dependencies
        if: steps.ollama.outputs.available == 'true'
        run: npm ci

      - name: Build
        if: steps.ollama.outputs.available == 'true'
        run: npm run build

      - name: Run calibration suite
        if: steps.ollama.outputs.available == 'true'
        run: npm run calibrate
        env:
          OLLAMA_URL: http://localhost:11434
