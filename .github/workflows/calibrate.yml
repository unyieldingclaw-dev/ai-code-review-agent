name: Calibration

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  release:
    types: [published]
  workflow_dispatch:       # Manual trigger

jobs:
  calibrate:
    runs-on: self-hosted   # Requires Ollama on the runner (same machine as review workflow)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Ollama availability
        id: ollama
        run: |
          if curl -sf http://localhost:11434/api/tags > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ollama not available on this runner — skipping calibration"
          fi

      - name: Install dependencies
        if: steps.ollama.outputs.available == 'true'
        run: npm ci

      - name: Build
        if: steps.ollama.outputs.available == 'true'
        run: npm run build

      - name: Run calibration suite
        if: steps.ollama.outputs.available == 'true'
        run: npm run calibrate
        env:
          OLLAMA_URL: http://localhost:11434
